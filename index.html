<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>

  <style>
    /* ----- Page ----- */
    body {
      font-family: Georgia, serif;
      background: #f4f5f1;
      color: #172026;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.5s;
    }

    /* The page glows a soft colour depending on password strength */
    body.weak   { background: #fbe4e2; }  /* red */
    body.fair   { background: #fdf2d0; }  /* yellow */
    body.strong { background: #dcf3e6; }  /* green */

    /* ----- Card ----- */
    .card {
      background: white;
      width: 100%;
      max-width: 24rem;
      padding: 1.5rem;
      border: 2px solid #d5dad6;
      border-radius: 10px;
      transition: box-shadow 0.4s, border-color 0.4s;
    }

    body.weak .card   { border-color: #d93025; box-shadow: 0 0 30px rgba(217, 48, 37, 0.4); }
    body.fair .card   { border-color: #e5a400; box-shadow: 0 0 30px rgba(229, 164, 0, 0.4); }
    body.strong .card { border-color: #1e9e5a; box-shadow: 0 0 30px rgba(30, 158, 90, 0.4); }

    h1 { margin-top: 0; }

    /* ----- Tabs ----- */
    .tabs { margin-bottom: 1rem; }
    .tabs button {
      font: inherit;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.5rem 0;
      margin-right: 1rem;
      cursor: pointer;
      color: #5d6b73;
    }
    .tabs button.active {
      color: #172026;
      border-bottom-color: #1b5e63;
    }

    /* ----- Form ----- */
    label { display: block; margin-bottom: 1rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.6rem;
      margin-top: 0.3rem;
      font: inherit;
      border: 1px solid #d5dad6;
      border-radius: 6px;
    }
    .submit {
      width: 100%;
      padding: 0.7rem;
      font: inherit;
      font-weight: bold;
      color: white;
      background: #1b5e63;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* ----- Password strength ----- */
    .meter { height: 6px; background: #d5dad6; border-radius: 3px; margin-top: 0.5rem; }
    .meter div { height: 100%; width: 0; border-radius: 3px; transition: width 0.2s, background 0.2s; }

    body.weak .meter div   { background: #d93025; }
    body.fair .meter div   { background: #e5a400; }
    body.strong .meter div { background: #1e9e5a; }

    .score { margin: 0.5rem 0 0; font-weight: bold; }
    .tip { font-size: 0.85rem; color: #5d6b73; margin: 0.3rem 0 0; }

    /* ----- Messages ----- */
    .error   { color: #b3261e; }
    .success { color: #2e7d4f; }

    .hidden { display: none; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Welcome</h1>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <button id="tab-login" class="active">Sign in</button>
      <button id="tab-register">Create account</button>
    </div>

    <!-- Sign in form -->
    <form id="login-form">
      <label>Username or email
        <input id="login-identifier" type="text">
      </label>
      <label>Password
        <input id="login-password" type="password">
      </label>
      <button class="submit" type="submit">Sign in</button>
    </form>

    <!-- Create account form -->
    <form id="register-form" class="hidden">
      <label>Username
        <input id="reg-username" type="text">
      </label>
      <label>Email
        <input id="reg-email" type="email">
      </label>
      <label>Password
        <input id="reg-password" type="password">
      </label>

      <!-- Live password strength -->
      <div class="meter"><div id="meter-bar"></div></div>
      <p class="score hidden" id="score-text"></p>
      <p class="tip" id="tip-text"></p>

      <br>
      <button class="submit" type="submit">Create account</button>
    </form>

    <!-- Messages (errors / success) -->
    <p id="message"></p>

    <!-- Shown after signing in -->
    <div id="welcome" class="hidden">
      <p>Signed in as <strong id="welcome-name"></strong>.</p>
      <button class="submit" id="logout-button">Sign out</button>
    </div>
  </div>

  <script>
    // ===== 1. GRAB THE ELEMENTS WE NEED =====
    var tabLogin = document.getElementById("tab-login");
    var tabRegister = document.getElementById("tab-register");
    var tabs = document.getElementById("tabs");

    var loginForm = document.getElementById("login-form");
    var registerForm = document.getElementById("register-form");

    var passwordInput = document.getElementById("reg-password");
    var meterBar = document.getElementById("meter-bar");
    var scoreText = document.getElementById("score-text");
    var tipText = document.getElementById("tip-text");

    var message = document.getElementById("message");
    var welcome = document.getElementById("welcome");

    // ===== 2. HELPER FUNCTIONS =====

    // Show a message under the form. type is "error" or "success"
    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "";
    }

    // Send data to the server and get the answer back
    async function sendToServer(url, data) {
      var response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      var result = await response.json();
      return { ok: response.ok, data: result };
    }

    // Reset the strength meter and the page glow
    function resetMeter() {
      document.body.className = "";
      meterBar.style.width = "0";
      scoreText.classList.add("hidden");
      tipText.textContent = "";
    }

    // ===== 3. TABS =====
    function showLogin() {
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      resetMeter();
      clearMessage();
    }

    function showRegister() {
      loginForm.classList.add("hidden");
      registerForm.classList.remove("hidden");
      tabLogin.classList.remove("active");
      tabRegister.classList.add("active");
      clearMessage();
    }

    tabLogin.onclick = showLogin;
    tabRegister.onclick = showRegister;

    // ===== 4. LIVE PASSWORD SCORE =====
    var timer;

    passwordInput.oninput = function () {
      clearTimeout(timer); // wait until the user pauses typing
      var password = passwordInput.value;

      if (password === "") {
        resetMeter();
        return;
      }

      timer = setTimeout(async function () {
        var reply = await sendToServer("/api/check-password", { password: password });
        if (!reply.ok) return;

        var score = reply.data.score;

        // Red below the minimum, yellow below 60, green from 60 up
        var level;
        if (score < reply.data.minScore) {
          level = "weak";
        } else if (score < 60) {
          level = "fair";
        } else {
          level = "strong";
        }
        document.body.className = level;

        meterBar.style.width = Math.max(score, 4) + "%";
        scoreText.classList.remove("hidden");
        scoreText.textContent = score + " / 100 - " + reply.data.strength;

        if (level === "strong") {
          tipText.textContent = "Looks good.";
        } else {
          tipText.textContent = reply.data.suggestions[0] || "";
        }
      }, 150);
    };

    // ===== 5. CREATE ACCOUNT =====
    registerForm.onsubmit = async function (event) {
      event.preventDefault(); // stop the page from reloading
      clearMessage();

      var reply = await sendToServer("/api/register", {
        username: document.getElementById("reg-username").value,
        email: document.getElementById("reg-email").value,
        password: passwordInput.value
      });

      if (reply.ok) {
        registerForm.reset();
        showLogin();
        showMessage(reply.data.message, "success");
      } else {
        showMessage(reply.data.error, "error");
      }
    };

    // ===== 6. SIGN IN =====
    loginForm.onsubmit = async function (event) {
      event.preventDefault();
      clearMessage();

      var reply = await sendToServer("/api/login", {
        identifier: document.getElementById("login-identifier").value,
        password: document.getElementById("login-password").value
      });

      if (reply.ok) {
        loginForm.classList.add("hidden");
        tabs.classList.add("hidden");
        document.getElementById("welcome-name").textContent = reply.data.username;
        welcome.classList.remove("hidden");
      } else {
        showMessage(reply.data.error, "error");
      }
    };

    // ===== 7. SIGN OUT =====
    document.getElementById("logout-button").onclick = function () {
      welcome.classList.add("hidden");
      tabs.classList.remove("hidden");
      loginForm.reset();
      showLogin();
    };
  </script>
</body>
</html>
